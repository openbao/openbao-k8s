# Creates a GitHub release in draft state, including artifacts to be published.
# Review artifacts and publish the draft release to trigger further release
# workflows (release-images.yml, release-packages.yml). Preselect the correct
# branch before running this workflow!

name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g., v2.0.0
        required: true
        type: string
  
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-slim
    steps:
      - name: Refuse versions that do not start with 'v'
        if: "!startsWith($VERSION, 'v')"
        run: echo "::error::Version '$VERSION' must start with a 'v'" && exit 1
        env:
          VERSION: ${{ inputs.version }}

  build:
    name: Build ${{ matrix.target.os }}/${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    needs:
      - setup
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GOOS: ${{ matrix.target.os }}
      GOARM: ${{ matrix.target.arm }}
      GOARCH: ${{ matrix.target.arch }}
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64       }
          - { os: linux, arch: arm64       }
          - { os: linux, arch: arm, arm: 6 }
          - { os: linux, arch: ppc64le     }
          - { os: linux, arch: riscv64     }
          - { os: linux, archGOAR: s390x   }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      
      - name: Cache Setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./dist/**/openbao-k8s
            ./dist/*.tar.gz
            ./dist/*.gpgsig
            ./dist/*.sigstore.json
          key: ${{ github.ref }}
      
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        id: gpg-import
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}
      
      - name: Build
        run: |
          git tag "$VERSION"
          make build

      - name: Create archive
        run: |
          mkdir -p dist && cd dist
          archive="openbao-k8s_${VERSION#v}_${GOOS}_${GOARCH}"

          if [[ -n "${GOARM:-}" ]]; then
            archive="${archive}v${GOARM}"
          fi

          tar czf "${archive}.tar.gz" openbao-k8s -C .. LICENSE README.md CHANGELOG.md
      
      - name: Generate SBOMs
        run: |
          for f in *; do
            syft "$f" --output "spdx-json=${f}.sbom.json" --enrich all
          done
        working-directory: dist
        env:
          SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES: "true"
          SYFT_GOLANG_SEARCH_REMOTE_LICENSES: "true"
      
      - name: Sign artifacts
        run: |
          cd dist
          artifacts=$(find . -type f -not -name '*.gpgsig' -not -name '*.sigstore.json')

          while read -r f; do
            gpg \
              --batch \
              --detach-sign \
              --default-key="$GPG_FINGERPRINT" \
              --output="${f}.gpgsig" \
              "$f" <<< "$GPG_PASSWORD"

            cosign sign-blob \
              --yes \
              --bundle="${f}.sigstore.json" \
              "$f"
          done <<< "$artifacts"
        env:
          GPG_FINGERPRINT: ${{ steps.gpg-import.outputs.fingerprint }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.arm }}
          path: dist
          overwrite: true
          retention-days: 1
          compression-level: 0

  build-dist:
    name: Build distribution source tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version

      - name: Cache Setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./dist/**/openbao-k8s
            ./dist/*.tar.gz
            ./dist/*.gpgsig
            ./dist/*.sigstore.json
          key: ${{ github.ref }}

      - name: Vendor Go modules
        run: go mod vendor

      - name: Make distribution source tarball
        run: |
          tar --exclude .git --exclude '*.gz' -cJf ../openbao-k8s-dist-$VERSION.tar.xz --xform="s,^\.,openbao-k8s-dist-$VERSION," .
          mv ../*.xz .
        env:
          VERSION: ${{ inputs.version }}

      - name: Upload distribution source tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-tarball
          path: "*.xz"
          overwrite: true
          retention-days: 1
          compression-level: 0

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
      - build-dist
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        id: gpg-import
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate & sign checksums
        run: |
          cd dist
          
          # Checksum all files in dist, except for signatures
          find . -type f -not -name '*.gpgsig' -not -name '*.sigstore.json' -exec basename {} \; \
            | sort \
            | xargs sha256sum \
            > ../checksums.txt && mv ../checksums.txt .
          
          # Sign with gpg
          gpg \
            --batch \
            --detach-sign \
            --default-key="$GPG_FINGERPRINT" \
            --output=checksums.txt.gpgsig \
            checksums.txt <<< "$GPG_PASSWORD"

          # Sign with cosign
          cosign sign-blob \
            --yes \
            --bundle=checksums.txt.sigstore.json \
            checksums.txt
        env:
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_FINGERPRINT: ${{ steps.gpg-import.outputs.fingerprint }}

      - name: Create draft release
        run: |
          gh release create "$VERSION" \
            --draft \
            --repo="$GITHUB_REPOSITORY" \
            --title="$VERSION" \
            --target="$GITHUB_SHA" \
            dist/*
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
