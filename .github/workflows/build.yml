name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v2.0.0"
        required: false
        type: string

jobs:
  build:
    name: Build ${{ matrix.target.os }}/${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    needs:
      - setup
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GOOS: ${{ matrix.target.os }}
      GOARM: ${{ matrix.target.arm }}
      GOARCH: ${{ matrix.target.arch }}
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64       }
          - { os: linux, arch: arm64       }
          - { os: linux, arch: arm, arm: 6 }
          - { os: linux, arch: ppc64le     }
          - { os: linux, arch: riscv64     }
          - { os: linux, archGOAR: s390x   }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      
      - name: Cache Setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./dist/**/openbao-k8s
            ./dist/*.tar.gz
            ./dist/*.gpgsig
            ./dist/*.sigstore.json
          key: ${{ github.ref }}
      
      - name: Build
        run: |
          git tag "$VERSION"
          make build

      - name: Create archive
        run: |
          cd dist
          archive="openbao-k8s_${VERSION#v}_${GOOS}_${GOARCH}"

          if [[ -n "${GOARM:-}" ]]; then
            archive="${archive}v${GOARM}"
          fi

          tar czf "${archive}.tar.gz" openbao-k8s -C .. LICENSE README.md CHANGELOG.md
      
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.arm }}
          path: dist
          overwrite: true
          retention-days: 1
          compression-level: 0

  build-images:
    name: ${{ matrix.distro.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: openbao-k8s
            target: default
            include: >-
              ${{
                github.event_name == 'release' ||
                contains(fromJSON('["all", "openbao-k8s"]'), inputs.distro)
              }}
            platforms:
              - linux/amd64
              - linux/arm64
              - linux/arm/v6
              - linux/ppc64le
              - linux/riscv64
              - linux/s390x
          - name: openbao-k8s-ubi
            target: ubi
            include: >-
              ${{
                github.event_name == 'release' ||
                contains(fromJSON('["all", "openbao-k8s-ubi"]'), inputs.distro)
              }}
            platforms:
              - linux/amd64
              - linux/arm64
              - linux/ppc64le
              - linux/s390x
          - name: openbao-k8s-distroless
            target: distroless
            include: >-
              ${{
                github.event_name == 'release' ||
                contains(fromJSON('["all", "openbao-k8s-distroless"]'), inputs.distro)
              }}
            platforms:
              - linux/amd64
              - linux/arm64
              - linux/arm
              - linux/ppc64le
              - linux/riscv64
              - linux/s390x
        exclude:
          - distro:
              include: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine tags
        id: tags
        run: .github/scripts/release/container-tags.sh
        env:
          IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.distro.name }}

      - name: Download release artifacts
        run: |
          ./scripts/release/download-artifacts.sh
          ./scripts/release/extract-linux-binaries.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PATTERN: openbao-k8s_*_linux_*.tar.gz

      - name: Get release info
        id: info
        run: |
          echo "sha=$(git rev-parse "$VERSION")" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct "$VERSION")" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=iso-strict-local "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ${{ join(fromJSON(steps.tags.outputs.tags), ',') }}
          target: ${{ matrix.distro.target }}
          platforms: ${{ join(matrix.distro.platforms, ',') }}
          outputs: type=registry,rewrite-timestamp=true
          build-args: SOURCE_DATE_EPOCH=${{ steps.info.outputs.epoch }}
          # We add both "legacy" non-namespaced labels and OCI-standardized
          # labels. Legacy labels are primarily required for Red Hat to certify
          # images based on UBI, but it does not harm to add them to all
          # distributions.
          labels: |
            name=OpenBao K8s
            maintainer=OpenBao <openbao@lists.openssf.org>
            vendor=OpenBao
            version=${{ env.VERSION }}
            release=${{ steps.info.outputs.epoch }}
            build-date=${{ steps.info.outputs.date }}
            summary=The OpenBao K8s binary includes first-class integrations between OpenBao and Kubernetes
            description=OpenBao K8s includes first-class integrations between OpenBao and Kuberentes. Integrations include the OpenBao Agent Injector mutating admission webhook
            url=https://openbao.org
            vcs-ref=${{ steps.info.outputs.sha }}
            vcs-type=git
            org.opencontainers.image.authors=OpenBao <openbao@lists.openssf.org>
            org.opencontainers.image.url=https://openbao.org
            org.opencontainers.image.documentation=https://github.com/openbao/openbao-k8s/blob/main/README.md
            org.opencontainers.image.source=https://github.com/openbao/openbao-k8s
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.info.outputs.sha }}
            org.opencontainers.image.vendor=OpenBao
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=OpenBao K8s
            org.opencontainers.image.description=OpenBao K8s includes first-class integrations between OpenBao and Kuberentes. Integrations include the OpenBao Agent Injector mutating admission webhook
